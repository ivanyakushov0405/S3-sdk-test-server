

server {
    listen 80;
    listen [::]:80;
    server_name syn-shlyukhi.ru www.syn-shlyukhi.ru logs.syn-shlyukhi.ru;
    location ^~ /.well-known/acme-challenge/ { 
        root /var/www/certbot; 
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name syn-shlyukhi.ru www.syn-shlyukhi.ru;

    ssl_certificate     /etc/letsencrypt/live/syn-shlyukhi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syn-shlyukhi.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    gzip on;
    gzip_types application/json application/javascript text/plain text/css image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:4000/api/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s; 
        proxy_send_timeout 300s;
        client_max_body_size 100M;
        
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name logs.syn-shlyukhi.ru;

    ssl_certificate     /etc/letsencrypt/live/syn-shlyukhi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syn-shlyukhi.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}