
services:

  app:
    image: app:1.0
    build: ./backend
    container_name: app-container
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=dev-container
      - CORS_FRONTEND_URL=${FRONT_URL}
      - PG_HOST=host.docker.internal
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - backend
    labels:
      - "app=server"
    restart: unless-stopped
  
  frontend:
    build: ./client
    container_name: frontend-container
    ports:
      - "80:80"
    
    depends_on:
      - app
    networks:
      - backend
    restart: unless-stopped
  
  redis:
    image: redis:7-alpine
    container_name: redis-container
    networks:
      - backend
    volumes:
    - redis-data:/data
    restart: unless-stopped
  
  loki:
    image: grafana/loki:3.2.0
    container_name: loki-container
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    environment:
      - S3_ACCESS=${S3_ACCESS_KEY_ID_LOGS}
      - S3_SECRET=${S3_SECRET_ACCESS_KEY_LOGS}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET_LOGS}
      - S3_ENDPOINT=${S3_ENDPOINT}
    networks:
      - backend
    restart: unless-stopped
  
  alloy:
    image: grafana/alloy:latest
    container_name: alloy-container
    volumes:
      - ./alloy-config.river:/etc/alloy/config.river
      - /var/run/docker.sock:/var/run/docker.sock
    command: run /etc/alloy/config.river --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345"
    depends_on:
      - loki
    networks:
      - backend
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-container
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  grafana-data:
  redis-data: